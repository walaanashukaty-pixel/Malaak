name: Android Release Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.47.1
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Build verified Android APK and AAB
        run: bash scripts/build_android_release.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: malaak-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: malaak-android-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
